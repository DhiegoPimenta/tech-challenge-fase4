name: Deploy Azure

# Manual. Builda a imagem Docker nos runners do GitHub (não depende do ACR Tasks, que não existe
# em assinaturas de teste gratuito/estudante), envia ao ACR e atualiza o Container App.
#
# A infra (Bicep) é criada uma vez com `infra/deploy.ps1`/`deploy.sh` (fase 1). Este workflow só
# publica a imagem, então a identidade do GitHub precisa apenas de Contributor no resource group
# + AcrPush no registry (ver infra/setup-github-oidc.ps1) - nada de Owner.
#
# Login por OIDC (sem senha guardada). Secrets do repositório:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variável opcional: AZURE_RESOURCE_GROUP (padrão rg-hospital-monitor)
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-hospital-monitor' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Descobrir recursos
        run: |
          echo "ACR=$(az acr list -g "$RG" --query '[0].name' -o tsv)" >> "$GITHUB_ENV"
          echo "APP=$(az containerapp list -g "$RG" --query '[0].name' -o tsv)" >> "$GITHUB_ENV"

      - name: Login no ACR
        run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR }}.azurecr.io/hospital-monitor:${{ github.sha }}
            ${{ env.ACR }}.azurecr.io/hospital-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release no Container App
        run: |
          az containerapp update -g "$RG" -n "$APP" --image "$ACR.azurecr.io/hospital-monitor:${{ github.sha }}"
          az containerapp ingress update -g "$RG" -n "$APP" --target-port 8501
          FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "App: https://$FQDN"
          echo "### App publicado: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
