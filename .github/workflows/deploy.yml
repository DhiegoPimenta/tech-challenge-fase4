name: Deploy Azure

# Manual. Builda a imagem Docker nos runners do GitHub (não depende do ACR Tasks, que não
# existe em assinaturas de teste gratuito/estudante), envia ao ACR e atualiza o Container App.
#
# Pré-requisito: a infra já existir (fase 1 do infra/deploy.ps1, ou rodar este workflow uma vez,
# pois ele também aplica o Bicep).
#
# Login por OIDC (sem senha guardada). Secrets do repositório:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Variáveis do repositório (opcionais, com padrão):
#   AZURE_RESOURCE_GROUP (rg-hospital-monitor), AZURE_LOCATION (eastus2),
#   SPEECH_SKU (F0), LANGUAGE_SKU (F0), MIN_REPLICAS (0)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Nome do ambiente
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-hospital-monitor' }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      ENVIRONMENT: ${{ inputs.environment }}
      SPEECH_SKU: ${{ vars.SPEECH_SKU || 'F0' }}
      LANGUAGE_SKU: ${{ vars.LANGUAGE_SKU || 'F0' }}
      MIN_REPLICAS: ${{ vars.MIN_REPLICAS || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infra (fase 1, idempotente)
        run: |
          az group create --name "$RG" --location "$LOCATION" --output none
          ACR=$(az deployment group create --resource-group "$RG" --template-file infra/main.bicep \
            --parameters environmentName="$ENVIRONMENT" speechSku="$SPEECH_SKU" languageSku="$LANGUAGE_SKU" minReplicas="$MIN_REPLICAS" \
            --query properties.outputs.acrName.value --output tsv)
          echo "ACR=$ACR" >> "$GITHUB_ENV"

      - name: Login no ACR
        run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR }}.azurecr.io/hospital-monitor:${{ github.sha }}
            ${{ env.ACR }}.azurecr.io/hospital-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release (fase 2)
        run: |
          URL=$(az deployment group create --resource-group "$RG" --template-file infra/main.bicep \
            --parameters environmentName="$ENVIRONMENT" speechSku="$SPEECH_SKU" languageSku="$LANGUAGE_SKU" minReplicas="$MIN_REPLICAS" \
            containerImage="hospital-monitor:${{ github.sha }}" \
            --query properties.outputs.appUrl.value --output tsv)
          echo "App: $URL"
          echo "### App publicado: $URL" >> "$GITHUB_STEP_SUMMARY"
